[project]
name = "stan"
version = "0.1.0"
description = "CLI para dar de alta grupos de K-pop y sus integrantes"
readme = "README.md"
authors = [
    { name = "Daniel Efraín Domínguez Urbina", email = "dominguezudaniele@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stan = "stan:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
